version: '3.9'

services:
  # -------------------------------
  # Database
  # -------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: haghighi_postgres
    env_file: .env
    ports:
      - "5432:5432" # برای dev/debug، در production بهتر نباشد
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -------------------------------
  # Backend
  # -------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_backend
    # Environment variables are loaded from .env file
    # Required Gateway variables: GATEWAY_TERMINAL_ID, GATEWAY_USERNAME, GATEWAY_PASSWORD
    # Optional Gateway variables: GATEWAY_MODE, GATEWAY_CALLBACK_URL, GATEWAY_AUTO_VERIFY, GATEWAY_AUTO_SETTLE
    env_file: .env
    environment:
      - API_BASE_URL=https://api.manehaghighi.com
      - RESET_DB=false   # اگر true باشد دیتابیس قبل از migration پاک می‌شود (برای production باید false باشد)
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./moc-old-data:/app/moc-old-data
      - ./backend/scripts:/app/scripts
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 40s
    command: node dist/src/main

  # -------------------------------
  # Frontend
  # -------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://api.manehaghighi.com/api
    container_name: haghighi_frontend
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -------------------------------
  # Admin Panel
  # -------------------------------
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://api.manehaghighi.com/api
    container_name: haghighi_admin
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -------------------------------
  # Nginx (پروکسی و SSL — دامنه‌ها: manehaghighi.com, admin.manehaghighi.com, api.manehaghighi.com)
  # کانفیگ: server-config/nginx-docker/
  # -------------------------------
  # nginx:
    # image: nginx:alpine
    # container_name: haghighi_nginx
    # ports:
    #   - "80:80"
    #   - "443:443"
    # volumes:
    #   - ./server-config/nginx-docker/nginx.conf:/etc/nginx/nginx.conf:rw
    #   - ./server-config/nginx-docker/conf.d:/etc/nginx/conf.d:rw
    #   - ./server-config/nginx-docker/options-ssl-nginx.conf:/etc/nginx/ssl-options.conf:rw
    #   - /etc/letsencrypt:/etc/letsencrypt:rw
    #   - ./certbot-webroot:/var/www/certbot:rw
    #   - ./path/to/live/certs:/etc/letsencrypt/live:rw
    #   - ./path/to/archive/certs:/etc/letsencrypt/archive:rw
    # networks:
    #   - frontend_network
    # depends_on:
    #   - backend
    #   - frontend
    #   - admin
    # restart: unless-stopped

  # -------------------------------
  # Prisma Studio (Dev only)
  # -------------------------------
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_prisma_studio
    env_file: .env
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio
    restart: unless-stopped

# -------------------------------
# Volumes & Networks
# -------------------------------

networks:
  backend_network:
    driver: bridge
    internal: false
  frontend_network:
    driver: bridge
    internal: false
