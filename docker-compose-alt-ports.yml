version: '3.8'

# Alternative port configuration to bypass firewalls
# Try using different ports that might not be blocked

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: haghighi_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_backend
    env_file: .env
    ports:
      - "8080:3000"  # Changed to 8080 (common HTTP alternative)
    volumes:
      - ./uploads:/app/uploads
      - ./moc-old-data:/app/moc-old-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://185.231.112.84:8080/api  # Updated port
    container_name: haghighi_frontend
    ports:
      - "8081:80"  # Changed to 8081
    depends_on:
      - backend
    restart: unless-stopped

  # Admin Panel
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://185.231.112.84:8080/api  # Updated port
    container_name: haghighi_admin
    ports:
      - "8082:80"  # Changed to 8082
    depends_on:
      - backend
    restart: unless-stopped

  # Prisma Studio
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_prisma_studio
    env_file: .env
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio
    restart: unless-stopped

volumes:
  postgres_data:

