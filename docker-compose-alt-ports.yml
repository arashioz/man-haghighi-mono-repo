version: '3.9'

services:
  # -------------------------------
  # Database
  # -------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: haghighi_postgres
    env_file: .env
    ports:
      - "5432:5432" # برای dev/debug، در production بهتر نباشد
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -------------------------------
  # Backend
  # -------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_backend
    env_file: .env
    ports:
      - "8080:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./moc-old-data:/app/moc-old-data
      - ./backend/scripts:/app/scripts
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESET_DB: "false"   # اگر true باشد دیتابیس قبل از migration پاک می‌شود (برای production باید false باشد)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 40s
    command: npm run start:prod

  # -------------------------------
  # Frontend
  # -------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://185.231.112.84:8080/api
    container_name: haghighi_frontend
    ports:
      - "8081:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -------------------------------
  # Admin Panel
  # -------------------------------
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://185.231.112.84:8080/api
    container_name: haghighi_admin
    ports:
      - "8082:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -------------------------------
  # Prisma Studio (Dev only)
  # -------------------------------
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_prisma_studio
    env_file: .env
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio
    restart: unless-stopped

# -------------------------------
# Volumes & Networks
# -------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  backend_network:
    driver: bridge
    internal: false
  frontend_network:
    driver: bridge
    internal: false
