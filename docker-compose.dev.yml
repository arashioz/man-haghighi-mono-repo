version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: haghighi_postgres_dev
    environment:
      POSTGRES_DB: haghighi_db
      POSTGRES_USER: haghighi_user
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - haghighi_network_dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_backend_dev
    environment:
      DATABASE_URL: "postgresql://haghighi_user:mysecretpassword@postgres:5432/haghighi_db?schema=public"
      JWT_SECRET: simple-jwt-secret
      JWT_EXPIRES_IN: 7d
      API_BASE_URL: http://localhost:3000
      PORT: 3000
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    networks:
      - haghighi_network_dev
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    command: npm run start:dev

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: haghighi_admin_dev
    environment:
      REACT_APP_API_URL: http://localhost/api
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    networks:
      - haghighi_network_dev
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haghighi_frontend_dev
    environment:
      REACT_APP_API_URL: http://localhost/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - haghighi_network_dev
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped

volumes:
  postgres_data_dev:
  uploads:

networks:
  haghighi_network_dev:
    driver: bridge
