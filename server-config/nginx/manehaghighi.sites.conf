# =============================================================================
# فایل manehaghighi — فقط سایت اصلی (manehaghighi.com + www) و ریدایرکت HTTP
# این فایل را در سرور به نام manehaghighi ذخیره کنید: /etc/nginx/sites-available/manehaghighi
# بلوک api.manehaghighi.com اینجا نیست؛ جداگانه در فایل api.manehaghighi.com باشد تا CORS درست کار کند.
# =============================================================================

# ریدایرکت HTTP به HTTPS برای همهٔ دامنه‌ها
server {
    listen 80;
    listen [::]:80;
    server_name manehaghighi.com www.manehaghighi.com admin.manehaghighi.com api.manehaghighi.com;
    return 301 https://$host$request_uri;
}

# سایت اصلی: manehaghighi.com و www.manehaghighi.com
# فرانت روی 8081، API روی همین دامنه زیر مسیر /api/ (همان origin → CORS لازم نیست)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manehaghighi.com www.manehaghighi.com;

    ssl_certificate /etc/letsencrypt/live/manehaghighi.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manehaghighi.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # فرانت‌اند
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API روی همان دامنه (manehaghighi.com/api/) — same-origin، CORS لازم نیست
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
