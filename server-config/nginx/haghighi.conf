# =============================================================================
# کانفیگ واحد nginx — حقیقی (manehaghighi)
# این فایل را در سرور کپی کنید و از داخل بلوک http {} لود کنید.
# مثلاً در nginx.conf داخل http { } فقط: include /etc/nginx/sites-enabled/*;
# و این فایل را به نام haghighi قرار دهید: sites-available/haghighi و لینک در sites-enabled.
#
# پورت‌ها (در صورت استفاده از docker-compose-alt-ports یا اجرای مستقیم):
#   بک‌اند API: 8080  |  فرانت: 8081  |  ادمین: 8082
# اگر با docker معمولی اجرا می‌کنید: بک‌اند 3000، فرانت 3002، ادمین 3001 — proxy_pass را عوض کنید.
#
# آپلود تا ۲۰ گیگ، CORS برای GET/POST/PUT/PATCH/DELETE، استریم ویدیو/صدا از /uploads
# =============================================================================

# CORS: فقط وقتی این فایل از داخل http {} include شود معتبر است.
# اگر این فایل را جدا لود می‌کنید، حتماً همین بلوک map را داخل http {} در nginx.conf قرار دهید.
# برای رفع خطای "No 'Access-Control-Allow-Origin' header": این فایل باید همان فایلی باشد که برای api.manehaghighi.com استفاده می‌شود و کل فایل (با map) از داخل http {} include شود.
map $http_origin $cors_api_origin {
    default "";
    "~*^https://admin\.manehaghighi\.com/?$" $http_origin;
    "~*^https://sales\.manehaghighi\.com/?$" $http_origin;
    "~*^https://(www\.)?manehaghighi\.com/?$" $http_origin;
    "~*^http://(www\.)?manehaghighi\.com(:[0-9]+)?/?$" $http_origin;
    "~*^https://api\.manehaghighi\.com/?$" $http_origin;
    "~*^http://localhost(:[0-9]+)?/?$" $http_origin;
    "~*^http://127\.0\.0\.1(:[0-9]+)?/?$" $http_origin;
    "~*^https://localhost(:[0-9]+)?/?$" $http_origin;
    "~*^https://127\.0\.0\.1(:[0-9]+)?/?$" $http_origin;
    "~*https?://[^/]*manehaghighi\.com" $http_origin;
}

# ---------- ریدایرکت HTTP به HTTPS برای همهٔ دامنه‌ها ----------
server {
    listen 80;
    listen [::]:80;
    server_name manehaghighi.com www.manehaghighi.com admin.manehaghighi.com api.manehaghighi.com;
    return 301 https://$host$request_uri;
}

# ---------- ادمین: admin.manehaghighi.com ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.manehaghighi.com;

    ssl_certificate /etc/letsencrypt/live/admin.manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.manehaghighi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ---------- API: api.manehaghighi.com (آپلود تا ۲۰G، CORS، استریم) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.manehaghighi.com;
    client_max_body_size 20G;

    ssl_certificate /etc/letsencrypt/live/api.manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.manehaghighi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # Preflight و پاسخ‌های API با CORS (GET/POST/PUT/PATCH/DELETE)
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_api_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Range, Accept-Ranges, Content-Range, Cache-Control, Pragma" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_request_buffering off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $cors_api_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Range, Accept-Ranges, Content-Range, Cache-Control, Pragma" always;
    }

    # استریم ویدیو/صدا — دسترسی به /uploads برای پخش
    location /uploads/stream/ {
        proxy_pass http://127.0.0.1:8080/uploads/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header Access-Control-Allow-Origin $cors_api_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Range, Accept, Origin" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_api_origin;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, If-Range, Accept, Origin";
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }
    }
}

# ---------- فرانت: manehaghighi.com و www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manehaghighi.com www.manehaghighi.com;

    ssl_certificate /etc/letsencrypt/live/manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manehaghighi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    # فرانت‌اند
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # درخواست‌های /api/ از همان دامنه به بک‌اند (اختیاری؛ اگر فرانت مستقیم به api.manehaghighi.com می‌زند این بلوک لازم نیست)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
