# Backend API Configuration for api.manehaghighi.com
server {
    listen 80;
    listen [::]:80;
    server_name api.manehaghighi.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.manehaghighi.com;

    # SSL Configuration (will be updated by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.manehaghighi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Remove server tokens
    server_tokens off;

    # Rate limiting for API
    # Note: limit_req_zone must be defined in http context (nginx.conf)
    # Uncomment after adding rate-limiting.conf to nginx.conf http block
    # limit_req zone=api_limit burst=20 nodelay;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Increase body size for file uploads
    client_max_body_size 10G;

    # Proxy to backend container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Origin so backend CORS and exception filter can set correct Access-Control-Allow-Origin
        proxy_set_header Origin $http_origin;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Optional CORS fallback if backend does not send headers (e.g. 502): uncomment and use map in http {} for multiple origins
        # add_header Access-Control-Allow-Origin "https://admin.manehaghighi.com" always;
        # add_header Access-Control-Allow-Credentials "true" always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
        # add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Range, Accept-Ranges, Content-Range" always;
    }

    # Video streaming location with proper CORS and range support
    location /uploads/stream/ {
        proxy_pass http://127.0.0.1:3000/uploads/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable range requests for video streaming
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        # Allow CORS for video streaming
        add_header Access-Control-Allow-Origin "https://admin.manehaghighi.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Range, Accept, Origin" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://admin.manehaghighi.com";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, If-Range, Accept, Origin";
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
}

