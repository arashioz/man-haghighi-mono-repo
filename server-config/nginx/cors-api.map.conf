# CORS map for API - باید داخل بلوک http {} در nginx.conf اصلی include شود.
# مثال در nginx.conf:
#   http {
#     include /path/to/cors-api.map.conf;
#     ...
#   }
# این map مقدار $cors_api_origin را از روی هدر Origin درخواست پر می‌کند؛
# فقط برای originهای مجاز، در غیر این صورت خالی می‌ماند.
map $http_origin $cors_api_origin {
    default "";
    "~^https://admin\.manehaghighi\.com$" $http_origin;
    "~^https://sales\.manehaghighi\.com$" $http_origin;
    "~^https://(www\.)?manehaghighi\.com$" $http_origin;
    "~^https://api\.manehaghighi\.com$" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}
