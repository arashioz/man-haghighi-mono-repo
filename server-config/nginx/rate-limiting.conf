# Rate Limiting Zones
# This file should be included in the http context of nginx.conf
# Add this line to /etc/nginx/nginx.conf in the http block:
#   include /etc/nginx/conf.d/rate-limiting.conf;

# Admin panel rate limiting: 10 requests per minute
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;

# API rate limiting: 100 requests per minute
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

