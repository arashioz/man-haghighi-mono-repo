# Dovecot configuration file
# This is the main configuration file - merge with existing settings

# Protocols
protocols = imap pop3 lmtp

# Mail location
mail_location = maildir:/var/mail/vhosts/%d/%n

# User and group
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# Authentication
auth_mechanisms = plain login
!include auth-sql.conf.ext

# SSL/TLS Configuration
ssl = required
ssl_cert = </etc/letsencrypt/live/mail.manehaghighi.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.manehaghighi.com/privkey.pem
ssl_protocols = !SSLv2 !SSLv3 !TLSv1 !TLSv1.1
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = yes

# IMAP settings
protocol imap {
  mail_plugins = $mail_plugins
}

# POP3 settings
protocol pop3 {
  mail_plugins = $mail_plugins
  pop3_uidl_format = %08Xu%08Xv
}

# LMTP settings
protocol lmtp {
  postmaster_address = postmaster@manehaghighi.com
}

# Service configurations
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
  user = dovecot
}

service auth-worker {
  user = vmail
}

# Logging
log_path = /var/log/dovecot/dovecot.log
info_log_path = /var/log/dovecot/dovecot-info.log
debug_log_path = /var/log/dovecot/dovecot-debug.log

