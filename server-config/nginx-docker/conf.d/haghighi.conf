# =============================================================================
# کانفیگ واحد برای Docker — manehaghighi
# سرویس‌ها: backend:3000, frontend:80, admin:80 (نام سرویس در docker-compose)
# آپلود تا ۲۰ گیگ، تایم‌اوت طولانی برای آپلود، CORS برای API
# =============================================================================

# CORS برای API — دامنه‌های مجاز
map $http_origin $cors_origin {
    default "";
    "~*^https?://(www\.)?manehaghighi\.com$" $http_origin;
    "~*^https?://admin\.manehaghighi\.com$" $http_origin;
    "~*^https?://api\.manehaghighi\.com$" $http_origin;
    "~*^https?://sales\.manehaghighi\.com$" $http_origin;
    "~*^http://localhost(:[0-9]+)?$" $http_origin;
    "~*^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

# ---------- پورت ۸۰: ریدایرکت به HTTPS + چالش certbot برای تمدید ----------
server {
    listen 80;
    listen [::]:80;
    server_name manehaghighi.com www.manehaghighi.com admin.manehaghighi.com api.manehaghighi.com;

    # برای تمدید گواهی: certbot با --webroot و -w ./certbot-webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- ادمین: admin.manehaghighi.com (آپلود تا ۲۰G، تایم‌اوت طولانی) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.manehaghighi.com;
    client_max_body_size 20G;

    ssl_certificate /etc/letsencrypt/live/admin.manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.manehaghighi.com/privkey.pem;
    include /etc/nginx/ssl-options.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 75s;
    }
}

# ---------- API: api.manehaghighi.com (آپلود تا ۲۰G، CORS، استریم) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.manehaghighi.com;
    client_max_body_size 20G;

    ssl_certificate /etc/letsencrypt/live/api.manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.manehaghighi.com/privkey.pem;
    include /etc/nginx/ssl-options.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header Access-Control-Allow-Origin https://manehaghighi.com;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # مدیا (عکس، ویدیو، صدا) — CORS + CORP تا از فرانت لود شوند
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Range, Accept-Ranges, Content-Range, Cache-Control, Pragma" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 75s;
        proxy_request_buffering off;
    }

    location /uploads/stream/ {
        proxy_pass http://backend:3000/uploads/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}

# ---------- فرانت: manehaghighi.com و www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manehaghighi.com www.manehaghighi.com;

    ssl_certificate /etc/letsencrypt/live/manehaghighi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manehaghighi.com/privkey.pem;
    include /etc/nginx/ssl-options.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
