    # =============================================================================
    # کانفیگ واحد برای Docker — manehaghighi
    # سرویس‌ها: backend:3000, frontend:80, admin:80 (نام سرویس در docker-compose)
    # آپلود تا ۲۰ گیگ، تایم‌اوت طولانی. CORS فقط در NestJS — nginx فقط proxy.
    # =============================================================================

    # ---------- پورت ۸۰: ریدایرکت به HTTPS + چالش certbot برای تمدید ----------
    server {
        listen 80;
        listen [::]:80;
        server_name manehaghighi.com www.manehaghighi.com admin.manehaghighi.com api.manehaghighi.com;

        # برای تمدید گواهی: certbot با --webroot و -w ./certbot-webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- ادمین: admin.manehaghighi.com (آپلود تا ۲۰G، تایم‌اوت طولانی) ----------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.manehaghighi.com;
        client_max_body_size 20G;

        ssl_certificate /etc/letsencrypt/live/admin.manehaghighi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.manehaghighi.com/privkey.pem;
        include /etc/nginx/ssl-options.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        server_tokens off;

        location / {
            proxy_pass http://haghighi_admin:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_connect_timeout 75s;
        }
    }

    # ---------- API: api.manehaghighi.com (آپلود تا ۲۰G، استریم). CORS فقط در NestJS؛ nginx فقط proxy ----------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.manehaghighi.com;
        client_max_body_size 20G;

        ssl_certificate /etc/letsencrypt/live/api.manehaghighi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.manehaghighi.com/privkey.pem;
        include /etc/nginx/ssl-options.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

        location /uploads/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /uploads/stream/ {
            proxy_pass http://backend:3000/uploads/stream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_connect_timeout 75s;
            proxy_request_buffering off;
        }
    }

    # ---------- فرانت: manehaghighi.com و www ----------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name manehaghighi.com www.manehaghighi.com;

        ssl_certificate /etc/letsencrypt/live/manehaghighi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manehaghighi.com/privkey.pem;
        include /etc/nginx/ssl-options.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        server_tokens off;

        location / {
            proxy_pass http://haghighi_frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
