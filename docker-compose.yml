services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: haghighi_postgres
    env_file: .env
    # Remove public port exposure - only accessible via internal network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security: Configure PostgreSQL logging (optional)
    # command: postgres -c log_statement=ddl -c log_destination=stderr

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_backend
    # Environment variables are loaded from .env file
    # Required SMS variables: IRANPAYAMAK_API_KEY, IRANPAYAMAK_LINE_NUMBER, IRANPAYAMAK_PATTERN_CODE
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./moc-old-data:/app/moc-old-data
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: haghighi_frontend
    ports:
      - "3002:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Admin Panel
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: haghighi_admin
    ports:
      - "3001:80"
    networks:
      - frontend_network
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Prisma CLI Service (for running Prisma commands)
  prisma:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haghighi_prisma
    env_file: .env
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/node_modules:/app/node_modules
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    # This service doesn't run by default - use it with docker-compose run
    # Example: docker-compose run --rm prisma npx prisma migrate dev
    # Example: docker-compose run --rm prisma npx prisma studio
    # Example: docker-compose run --rm prisma npx prisma generate
    command: tail -f /dev/null
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  backend_network:
    driver: bridge
    internal: false
  frontend_network:
    driver: bridge
    internal: false
